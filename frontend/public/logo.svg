<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e90ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- "Cod" -->
  <text x="10" y="62" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#blueGrad)">Cod</text>

  <!-- Circuit "e" target icon at ~x=158, y=38 -->
  <g transform="translate(161,38)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1e90ff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#1e90ff" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="3" fill="#1e90ff"/>
    <!-- right connector -->
    <line x1="12" y1="0" x2="20" y2="0" stroke="#1e90ff" stroke-width="2"/>
    <circle cx="23.5" cy="0" r="2.5" fill="#1e90ff"/>
  </g>

  <!-- "virus" -->
  <text x="188" y="62" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#blueGrad)">virus</text>

  <!-- "INSIGHTS" with side decoration lines -->
  <line x1="54"  y1="82" x2="90"  y2="82" stroke="#1e90ff" stroke-width="1.2" opacity="0.8"/>
  <text x="97" y="93" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e90ff" letter-spacing="5">INSIGHTS</text>
  <line x1="300" y1="82" x2="336" y2="82" stroke="#1e90ff" stroke-width="1.2" opacity="0.8"/>
</svg>
